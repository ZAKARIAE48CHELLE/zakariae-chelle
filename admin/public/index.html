<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Back office</title>
<link rel="icon" href="/preview/assets/favicon.svg">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">ZC</span><div><b>Back office</b><small>Local only · not deployed</small></div></div>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="side-foot">
      <div class="save-state" id="saveState" role="status"></div>
      <button class="btn primary block" id="saveBtn" type="button">Save &amp; rebuild <kbd>Ctrl S</kbd></button>
      <button class="btn ghost block" id="discardBtn" type="button" hidden>Discard changes</button>
      <button class="btn ghost block sm" id="quitBtn" type="button">Stop back office</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Menu">☰</button>
      <h1 id="viewTitle">Overview</h1>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="banner" id="banner" hidden></div>
    <main id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-root" id="modalRoot"></div>
<script src="/shared/diagram.js"></script>
<script src="js/core.js"></script>
<script src="js/editors.js"></script>
<script src="js/diagram-editor.js"></script>
<script src="js/views-content.js"></script>
<script src="js/views-tools.js"></script>
<script src="js/app.js"></script>
</body>
</html>
